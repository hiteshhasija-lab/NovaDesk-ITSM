# NovaDesk — fresh install on one server (README.md, "Fresh install").
#
#   cp .env.example .env          then fill it in
#   mkdir certs                   optionally add certs/key.pem and certs/cert.pem for https
#   docker compose up -d --build  (or: podman compose up -d --build)
#
# On first start NovaDesk creates its database tables itself and the first admin account from
# ADMIN_USERNAME / ADMIN_PASSWORD. Upgrading later: pull the new code, then
# `up -d --build --force-recreate novadesk` (podman-compose keeps the old container without
# --force-recreate); table changes apply themselves at startup.
name: novadesk

services:
  novadesk:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/novadesk:local
    restart: unless-stopped
    env_file: .env
    environment:
      # The database, by its name on this compose network.
      PGHOST: postgres
      PGPORT: "5432"
    # NOVADESK_BIND_IP: listen on one of the server's addresses only (for a server with several IPs,
    # like one per app); default all of them.
    ports:
      - "${NOVADESK_BIND_IP:-0.0.0.0}:${NOVADESK_HTTP_PORT:-80}:8080"
      - "${NOVADESK_BIND_IP:-0.0.0.0}:${NOVADESK_HTTPS_PORT:-443}:8443"
    volumes:
      # Optional TLS certificate (certs/cert.pem + certs/key.pem): with it NovaDesk also serves https.
      # ':z' lets the container read it on SELinux hosts (RHEL, Fedora); other hosts ignore it.
      - ./certs:/app/certs:ro,z
      # Uploaded attachments, sessions and the Decommissioned Tracker workbook.
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  appdata:
  pgdata:
